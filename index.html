
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seventimenews Job Description Generator</title>
<style>
:root{--green:#08ad78;--dark:#172638;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;background:#f5f8fa;color:var(--dark);font:15px/1.6 Arial,sans-serif}
header{background:var(--dark);color:white;padding:22px max(20px,calc((100% - 1100px)/2))}
header strong{font-size:21px}
header p{margin:4px 0;color:#cbd5e1}
main{max-width:1100px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 5px 20px #1726380a}
h2{font-size:19px;margin:0 0 15px}
label{display:block;font-weight:650;margin:15px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
textarea{min-height:160px;resize:vertical}
button{border:0;border-radius:9px;padding:12px 17px;font:inherit;font-weight:bold;cursor:pointer}
.primary{background:var(--green);color:white;width:100%;margin-top:17px}
.secondary{background:#e8f5f0;color:#087a57}
.muted{font-size:13px;color:var(--muted)}
.status{font-size:13px;margin-top:12px;min-height:22px;color:var(--muted)}
.preview{border:1px solid var(--line);border-radius:10px;padding:18px;min-height:200px}
.preview h3{margin-top:0}
.apply{display:block;text-align:center;background:var(--green);color:white;text-decoration:none;padding:13px;border-radius:8px;font-weight:bold;margin-top:20px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101b2b;color:#e2e8f0;padding:14px;border-radius:9px;max-height:350px;overflow:auto;font-size:12px}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
@media(max-width:760px){main{grid-template-columns:1fr;margin:16px auto}.panel{padding:17px}}
</style>
</head>
<body>

<header>
<strong>Seventimenews Job Generator</strong>
<p>Generate original job descriptions ready for publishing.</p>
</header>

<main>
<section class="panel">
<h2>1. Job Source</h2>
<p class="muted">Paste a job URL or manually paste the original job description.</p>

<label>Original Job URL</label>
<input id="jobUrl" type="url" placeholder="https://company.com/careers/job">

<label>Original Job Description</label>
<textarea id="description" placeholder="Paste the original job advertisement here if URL extraction does not work..."></textarea>

<label>Apply URL</label>
<input id="applyUrl" type="url" placeholder="https://company.com/apply">

<button class="primary" id="rewriteBtn">Rewrite Job Description</button>
<div class="status" id="status">Ready.</div>
</section>

<section class="panel">
<h2>2. Live Preview</h2>
<div class="preview">
<div id="previewBody">Your rewritten job description will appear here.</div>
<a class="apply" id="applyButton" href="#" target="_blank" rel="noopener noreferrer">Apply Now ↗</a>
</div>

<h2 style="margin-top:25px">3. HTML Output</h2>
<pre id="htmlOutput">Your HTML will appear here.</pre>

<div class="actions">
<button class="secondary" id="copyBtn">Copy HTML</button>
<button class="secondary" id="downloadBtn">Download HTML</button>
</div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);

let generatedBody = "";

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function makeHTML(body, applyUrl) {
  const safeURL = escapeHTML(applyUrl);
  return `<article class="job-description">
  ${body}
  <p><a href="${safeURL}" target="_blank" rel="noopener noreferrer"
  style="display:inline-block;background:#08ad78;color:#fff;padding:13px 25px;text-decoration:none;border-radius:7px;font-weight:bold">
  Apply Now</a></p>
</article>`;
}

$("rewriteBtn").addEventListener("click", async () => {
  const jobUrl = $("jobUrl").value.trim();
  const description = $("description").value.trim();
  const applyUrl = $("applyUrl").value.trim();

  if (!jobUrl && !description) {
    $("status").textContent = "Enter a job URL or paste a job description.";
    return;
  }

  if (!applyUrl || !/^https?:\/\//i.test(applyUrl)) {
    $("status").textContent = "Enter a valid Apply URL.";
    return;
  }

  if (jobUrl && !/^https?:\/\//i.test(jobUrl)) {
    $("status").textContent = "Enter a valid job URL.";
    return;
  }

  $("rewriteBtn").disabled = true;
  $("status").textContent = "AI is rewriting the job description. Please wait...";

  try {
    const response = await fetch("/api/rewrite", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({jobUrl, description})
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.error || "Generation failed.");

    generatedBody = data.body;

    // Preview: display AI-generated HTML
    $("previewBody").innerHTML = generatedBody;
    $("applyButton").href = applyUrl;

    $("htmlOutput").textContent = makeHTML(generatedBody, applyUrl);

    $("status").textContent = "Job description generated successfully.";

  } catch (error) {
    $("status").textContent = error.message;
  } finally {
    $("rewriteBtn").disabled = false;
  }
});

$("copyBtn").addEventListener("click", async () => {
  const html = $("htmlOutput").textContent;
  if (!generatedBody) return;
  try {
    await navigator.clipboard.writeText(html);
    $("status").textContent = "HTML copied.";
  } catch {
    $("status").textContent = "Please select and copy the HTML manually.";
  }
});

$("downloadBtn").addEventListener("click", () => {
  if (!generatedBody) return;
  const blob = new Blob([$("htmlOutput").textContent], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "seventimenews-job-post.html";
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
